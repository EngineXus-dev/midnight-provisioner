name: Verify source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q nightglass tests
      - name: Check installer shell syntax
        run: bash -n scripts/setup-nightglass.sh
      - name: Smoke-test headless machine tuning
        run: python -m nightglass profile show
      - name: Unit tests (no VMs or root)
        run: python -m unittest discover -s tests -v
