[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midnight-provisioner"
version = "0.1.0"
description = "Local workspace management and workstation setup for Fedora KDE"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Midnight Provisioner contributors"}]
keywords = ["libvirt", "virtualization", "workspaces", "kvm", "security"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
midnight-provisioner = "midnight_provisioner.cli:main"

[tool.setuptools.packages.find]
include = ["midnight_provisioner*"]
