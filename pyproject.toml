[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightglass-workspaces"
version = "0.1.0"
description = "Qubes-inspired security workspace controller for Fedora KDE"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nightglass contributors"}]
keywords = ["libvirt", "virtualization", "workspaces", "kvm", "security"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
nightglass = "nightglass.cli:main"

[tool.setuptools.packages.find]
include = ["nightglass*"]
